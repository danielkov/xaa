[package]
name = "xaa-client"
version = "0.0.0"
edition = "2024"
publish = false
description = "XAA client (requesting app): OIDC login, token exchange for an ID-JAG, jwt-bearer grant, protected API call."
license = "MIT OR Apache-2.0"

[[bin]]
name = "xaa-client"
path = "src/main.rs"

[dependencies]
xaa = { path = "../..", default-features = false, features = ["client", "reqwest-client"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

# The `--playground --saml` sign-on: this app as a SAML Service Provider.
# Without `xsd-validate`: the xaa.dev IdP puts `<ds:Signature>` before
# `<saml:Issuer>` in its assertions, which the SAML schema does not allow
# (docs/interop.md). Signature and every profile check still run.
saml = { version = "0.1.0-alpha.3", default-features = false, features = ["rsa-sha", "ecdsa-sha"] }

# The `--playground` browser login (PKCE). Not needed by the XAA flow itself.
base64 = "0.22"
rand = "0.10"
sha2 = "0.11"

serde_json = "1"
url = "2"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }

# Example carve-outs - keep the bar high but allow a few pedantic items that
# would otherwise force noisy refactors in glue code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
struct_field_names = "allow"
