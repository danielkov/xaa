[package]
name = "xaa-resource-as"
version = "0.0.0"
edition = "2024"
publish = false
description = "XAA Resource Authorization Server: validates ID-JAGs at the jwt-bearer grant and issues access tokens."
license = "MIT OR Apache-2.0"

[[bin]]
name = "xaa-resource-as"
path = "src/main.rs"

[dependencies]
# `reqwest-client` is for fetching the IdP's metadata and JWK Set.
xaa = { path = "../..", default-features = false, features = ["resource-as", "reqwest-client"] }

# Web stack. No default features: the example needs a plain HTTP/1 server only.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

# The demo protected resource: opaque access tokens.
base64 = "0.22"
rand = "0.10"

serde_json = "1"
url = "2"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }

# Example carve-outs - keep the bar high but allow a few pedantic items that
# would otherwise force noisy refactors in glue code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
struct_field_names = "allow"
